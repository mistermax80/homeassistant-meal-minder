add_meal:
  name: Add meal
  description: Add a meal to the meal plan
  fields:
    entry_id:
      name: Meal Minder instance
      description: Config entry ID of the Meal Minder instance
      required: true
      selector:
        text:

    plan_id:
      name: Plan ID
      description: Meal plan identifier
      required: true
      selector:
        text:

    date:
      name: Date
      description: Specific meal date (YYYY-MM-DD) for exceptions
      required: false
      selector:
        text:

    weekday:
      name: Weekday
      description: Recurring weekday (0=Monday, 6=Sunday)
      required: false
      selector:
        select:
          options:
            - label: Every day
              value: "-1"
            - label: Monday
              value: "0"
            - label: Tuesday
              value: "1"
            - label: Wednesday
              value: "2"
            - label: Thursday
              value: "3"
            - label: Friday
              value: "4"
            - label: Saturday
              value: "5"
            - label: Sunday
              value: "6"

    time:
      name: Time
      description: Meal time
      required: false
      selector:
        time:

    meal_type:
      name: Meal type
      description: Breakfast, lunch, snack or dinner
      required: true
      selector:
        select:
          options:
            - breakfast
            - snack
            - lunch
            - dinner

    items:
      name: Items
      description: One item per line
      required: true
      selector:
        text:
          multiline: true

    preparation_offset:
      name: Preparation offset
      description: Minutes before the meal for preparation
      required: false
      selector:
        number:
          min: -1440
          max: 0
          step: 15
          mode: box

    preparation_items:
      name: Preparation items
      description: Preparation tasks
      required: false
      selector:
        text:
          multiline: true

remove_meal:
  name: Remove meal
  description: Remove a meal from the plan
  fields:
    entry_id:
      name: Meal Minder instance
      description: Config entry ID of the Meal Minder instance
      required: true
      selector:
        text:
        
    id:
      name: Meal ID
      description: ID of the meal to remove
      required: true
      selector:
        text:

