add_meal:
  name: Add meal
  description: Add a meal to the meal plan
  fields:
    plan_id:
      name: Plan ID
      description: Meal plan identifier
      required: true
      selector:
        text:

    date:
      name: Date
      description: Specific meal date (YYYY-MM-DD) for exceptions
      required: false
      selector:
        text:

    weekday:
      name: Weekday
      description: Recurring weekday (0=Monday, 6=Sunday)
      required: false
      selector:
        number:
          min: 0
          max: 6
          mode: slider

    time:
      name: Time
      description: Meal time
      required: false
      selector:
        time:

    meal_type:
      name: Meal type
      description: Breakfast, lunch, snack or dinner
      required: true
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner

    items:
      name: Items
      description: One item per line
      required: true
      selector:
        text:
          multiline: true

    preparation_offset:
      name: Preparation offset
      description: Minutes before the meal for preparation
      required: false
      selector:
        number:
          min: -1440
          max: 0
          step: 15
          mode: box

    preparation_items:
      name: Preparation items
      description: Preparation tasks
      required: false
      selector:
        text:
          multiline: true

remove_meal:
  name: Remove meal
  description: Remove a meal from the plan
  fields:
    id:
      name: Meal ID
      description: ID of the meal to remove
      required: true
