get_meals:
  name: Get meals
  description: Get meals from the meal plan
  fields:
    entry_id:
      name: Meal Minder instance
      description: Config entry ID of the Meal Minder instance
      required: true
      selector:
        text:

    plan_id:
      name: Plan ID
      description: Filter by meal plan
      required: false
      selector:
        text:

    date:
      name: Date
      description: Filter meals by specific date
      required: false
      selector:
        date:

    weekday:
      name: Weekday
      description: Filter meals by weekday (0=Monday, 6=Sunday)
      required: false
      selector:
        number:
          min: 0
          max: 6
          mode: slider

    meal_type:
      name: Meal type
      description: Filter by breakfast, lunch or dinner
      required: false
      selector:
        select:
          options:
            - breakfast
            - snack
            - lunch
            - dinner
